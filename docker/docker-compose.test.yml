services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/trackit_test
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=test-secret-key
      - JWT_ACCESS_TOKEN_EXPIRATION=15m
      - JWT_REFRESH_TOKEN_EXPIRATION=7d
    command: npm run test

  mongodb:
    environment:
      - MONGO_INITDB_DATABASE=trackit_test

  redis: {}
