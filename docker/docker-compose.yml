services:
  frontend:
    build:
      context: ../frontend
    container_name: trackit-frontend
    networks:
      - trackit-network

  backend:
    build:
      context: ../backend
    container_name: trackit-backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trackit-network

  mongodb:
    image: mongo:7
    container_name: trackit-mongodb
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=trackit
    networks:
      - trackit-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/trackit --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trackit-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - trackit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  trackit-network:
    driver: bridge
